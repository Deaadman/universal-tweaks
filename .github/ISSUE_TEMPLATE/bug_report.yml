name: Bug report
description: Something in Universal Tweaks is wrong, broken or crashed the game.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. The more of this you fill in, the faster it can be fixed.
        One bug per report, please. Check the [open issues](https://github.com/Deaadman/universal-tweaks/issues) first, in case it's already there.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What went wrong, and any error you saw.
      placeholder: My flashlight stayed lit on the ground after its battery ran out.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      placeholder: The flashlight turns off when its battery is empty.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps from loading a save, and which settings you have on. How often it happens. A short video helps.
      placeholder: |
        1. Turn on Extended Functionality in the mod's settings
        2. Load a save with a flashlight outside an aurora
        3. Turn it on, drop it and wait for the battery to run out

  - type: dropdown
    id: where
    attributes:
      label: Which part of the mod
      multiple: true
      options:
        - Carry weight or containers
        - Flashlights
        - Food and drink
        - Rock caches
        - Spray paint
        - Travois
        - The HUD or menus
        - Another tweak
        - The game crashed or wouldn't load
        - Something else
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: Universal Tweaks version
      description: The console window that opens with the game shows it when the mod loads, like 1.5.0 or 1.5.0-nightly.20261022+g1a2b3c4.
      placeholder: 1.5.0
    validations:
      required: true

  - type: input
    id: game-version
    attributes:
      label: The Long Dark version
      description: Shown at the bottom of the game's main menu.
      placeholder: "2.55"
    validations:
      required: true

  - type: textarea
    id: mods
    attributes:
      label: Your other mods
      description: Everything in your game's Mods folder. If you can, check whether it still happens with only Universal Tweaks and its dependencies.

  - type: textarea
    id: log
    attributes:
      label: MelonLoader log
      description: |
        First turn on every logging level in Complex Logger's options, in the game's Mod Settings menu, then make the bug happen again.
        Close the game, then drag `MelonLoader\Latest.log` from your game's folder into this box. Please attach the file rather than a screenshot of the console.
    validations:
      required: true

  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, a video, or anything else that might help.
