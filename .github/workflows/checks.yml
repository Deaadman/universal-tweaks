# Lint and test jobs shared by the release workflows; must pass before anything is built or published.

name: Checks

on:
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: 6.0.x

    - name: Verify Formatting
      run: dotnet format --verify-no-changes

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: 6.0.x

    - name: Run Tests
      run: dotnet test
