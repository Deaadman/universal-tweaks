# Once a week, opens a pull request against develop for NuGet packages and
# actions with a newer version. Minor and patch updates come together in one
# pull request per ecosystem; a new major version gets its own, since it may
# break the code. CI runs on each one, so merge it when it passes.
#
# A new Il2CppAssemblies version usually means a game update: check the mod
# in-game before releasing with it.

version: 2

updates:
  - package-ecosystem: nuget
    directories: [/src, /tests/UniversalTweaks.Tests]
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      packages:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
